<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div class="login-screen" id="loginScreen">
            <h1>🛒 Price Tracker</h1>
            <p class="subtitle">Track and compare prices across your favorite stores</p>
            <div class="input-group">
                <label for="password">Enter Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button onclick="login()">Login</button>
            <div id="loginError" class="error-message hidden">Incorrect password. Please try again.</div>
        </div>

        <!-- App Screen -->
        <div class="app-screen" id="appScreen">
            <h1>🛒 Price Tracker</h1>
            <div class="sync-status" id="syncStatus">Last synced: Never</div>
            <button onclick="syncData()" class="success-btn">🔄 Sync Data</button>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('scan')">Scan</button>
                <button class="tab" onclick="switchTab('add')">Add Price</button>
                <button class="tab" onclick="switchTab('view')">View All</button>
            </div>

            <!-- Scan Tab -->
            <div class="tab-content active" id="scanTab">
                <div class="scanner-container">
                    <video id="video" class="hidden"></video>
                    <button onclick="startScanner()" id="startScanBtn">📷 Start Scanner</button>
                    <button onclick="stopScanner()" id="stopScanBtn" class="secondary-btn hidden">Stop Scanner</button>
                </div>
                <div id="scanResult"></div>
            </div>

            <!-- Add Price Tab -->
            <div class="tab-content" id="addTab">
                <div class="input-group">
                    <label for="barcode">Barcode</label>
                    <input type="text" id="barcode" placeholder="Enter or scan barcode">
                </div>
                <div class="input-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" placeholder="e.g., Coffee Creamer">
                </div>
                <div class="input-group">
                    <label for="store">Store</label>
                    <select id="store">
                        <option value="Aldi">Aldi</option>
                        <option value="Wegmans">Wegmans</option>
                        <option value="BJ's">BJ's</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" step="0.01" placeholder="0.00">
                </div>
                <button onclick="addPrice()">Add Price</button>
            </div>

            <!-- View All Tab -->
            <div class="tab-content" id="viewTab">
                <div id="productList" class="product-list"></div>
            </div>

            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
